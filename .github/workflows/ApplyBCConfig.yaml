name: Apply BC Config

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Business Central environment to apply config to (DEV, TEST)
        required: true
      probeStandardApi:
        description: Diagnostic only - probe the standard API v2.0 entity list and 'accounts' entity instead of applying config
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

jobs:
  ApplyCustomerPostingGroups:
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environmentName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Customer Posting Groups
        shell: powershell
        env:
          BC_CLIENT_ID: ${{ vars.BC_DEPLOYMENT_CLIENT_ID }}
          BC_TENANT_ID: ${{ vars.BC_TENANT_ID }}
          PROBE_STANDARD_API: ${{ github.event.inputs.probeStandardApi }}
        run: |
          ./scripts/Apply-CustomerPostingGroups.ps1 `
            -Tenant $env:BC_TENANT_ID `
            -ClientId $env:BC_CLIENT_ID `
            -EnvironmentName '${{ github.event.inputs.environmentName }}' `
            -ConfigFile './config/customer-posting-groups.json'

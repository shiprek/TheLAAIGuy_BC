name: Import Leads

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Business Central environment to import leads into (DEV, TEST)
        required: true
      leadsFile:
        description: Path to the leads batch file under data/leads/
        required: true
        default: data/leads/2026-09-14-la-small-business.json

permissions:
  contents: read
  id-token: write

jobs:
  ImportLeads:
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environmentName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Leads
        shell: powershell
        env:
          BC_CLIENT_ID: ${{ vars.BC_DEPLOYMENT_CLIENT_ID }}
          BC_TENANT_ID: ${{ vars.BC_TENANT_ID }}
        run: |
          ./scripts/Import-Leads.ps1 `
            -Tenant $env:BC_TENANT_ID `
            -ClientId $env:BC_CLIENT_ID `
            -EnvironmentName '${{ github.event.inputs.environmentName }}' `
            -LeadsFile '${{ github.event.inputs.leadsFile }}' `
            -ResultsFile './import-results.json'

      - name: Upload import results
        uses: actions/upload-artifact@v4
        with:
          name: import-results
          path: import-results.json
